    <script>
    var _supabaseClient = null;
    function _initSupabase() {
        try {
            if (_supabaseClient) return;
            if (window.supabase && window.supabase.createClient) {
                _supabaseClient = window.supabase.createClient('https://ljhritlqicnlppwcoijw.supabase.co', 'sb_publishable_3DWixMg6ElVnJD08vOQJAA_-2Y0Pate');
            } else if (window.createClient) {
                _supabaseClient = window.createClient('https://ljhritlqicnlppwcoijw.supabase.co', 'sb_publishable_3DWixMg6ElVnJD08vOQJAA_-2Y0Pate');
            }
        } catch(e) { console.error('Supabase init error:', e); }
    }
    _initSupabase();
    setTimeout(_initSupabase, 500);
    setTimeout(_initSupabase, 1500);

    function _s() { _initSupabase(); return _supabaseClient; }

    // Sign up — Direct DB insert (bypasses Supabase Auth)
    function signUp(email, password, metadata) {
        return new Promise(function(resolve, reject) {
            var c = _s();
            if (!c) return reject(new Error('Cannot connect to server.'));
            var userId = crypto.randomUUID();
            var profile = {
                id: userId,
                email: email,
                password: password,
                name: (metadata && metadata.name) || email.split('@')[0],
                role: (metadata && metadata.role) || 'student',
                class: (metadata && metadata.class) || null,
                subject: (metadata && metadata.subject) || null,
                phone: (metadata && metadata.phone) || null
            };
            c.from('users').upsert(profile).then(function(res) {
                if (res.error) return reject(new Error(res.error.message));
                resolve({ user: profile });
            }).catch(function(err) { reject(err); });
        });
    }

    // Sign in — Direct DB query (bypasses Supabase Auth)
    function signIn(email, password) {
        return new Promise(function(resolve, reject) {
            var c = _s();
            if (!c) return reject(new Error('Cannot connect to server.'));
            c.from('users').select('*').eq('email', email).eq('password', password).maybeSingle().then(function(res) {
                if (res.error) return reject(new Error('Invalid email or password.'));
                if (!res.data) return reject(new Error('Invalid email or password.'));
                resolve({ user: res.data });
            }).catch(function(err) { reject(new Error('Invalid email or password.')); });
        });
    }

    var supabase = null;
    var DB = {
        createUser: function(u) { var c=_s(); if(!c) return Promise.resolve(); return c.from('users').upsert(u); },
        getUserProfile: function(id) { var c=_s(); if(!c) return Promise.reject(new Error('No connection')); return c.from('users').select('*').eq('id',id).single().then(function(r){ if(r.error) throw r.error; return r.data; }); },
        updateUserProfile: function(id, u) { var c=_s(); if(!c) return Promise.resolve(); return c.from('users').update(u).eq('id',id).select(); },
        getAllStudents: function() { var c=_s(); if(!c) return Promise.resolve([]); return c.from('users').select('*').eq('role','student').then(function(r){ return r.data||[]; }); },
        getStudentsByClass: function(cls) { var c=_s(); if(!c) return Promise.resolve([]); return c.from('users').select('*').eq('role','student').eq('class',cls).then(function(r){ return r.data||[]; }); },
        getAllTeachers: function() { var c=_s(); if(!c) return Promise.resolve([]); return c.from('users').select('*').eq('role','teacher').then(function(r){ return r.data||[]; }); }
    };

    function sendNotifToAdmin(title, message) {
        var c = _s();
        if (!c) return;
        c.from('notifications').insert({ title: title, message: message, target_role: 'admin', from_name: 'System', from_role: 'system' }).then(function() {}).catch(function() {});
    }

    function sendCongratsEmail(toEmail, name, role) {
        fetch('https://api.web3forms.com/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                access_key: '320741cd-4b44-449d-8231-b0150da8d26d',
                subject: 'Welcome to TECH-BRIDGE ACADEMY!',
                from_name: 'TECH-BRIDGE ACADEMY',
                email: toEmail,
                message: 'Dear ' + name + ',\n\nCongratulations! Your ' + role + ' account has been successfully created at TECH-BRIDGE ACADEMY.\n\nEmail: ' + toEmail + '\nRole: ' + role.charAt(0).toUpperCase() + role.slice(1) + '\n\nYou can now login to your portal at ' + window.location.origin + '/login.html using your email and password.\n\nWe wish you success!\n\nBest regards,\nTECH-BRIDGE ACADEMY'
            })
        }).then(function() { console.log('Welcome email sent'); }).catch(function(err) { console.log('Email failed:', err); });
    }
    </script>

        document.body.insertAdjacentHTML('beforeend', `

                </div>

        function showResetModal() {
            document.getElementById('resetPasswordModal').style.display = 'flex';
        }
        function closeResetModal() {
            document.getElementById('resetPasswordModal').style.display = 'none';
        }
        async function handleResetRequest(e) {
            e.preventDefault();
            const role = document.getElementById('resetRole').value;
            const email = document.getElementById('resetEmail').value.trim();
            const errorEl = document.getElementById('loginError');

            _initSupabase();
            if (!_supabaseClient) { alert('Cannot connect to server. Check your internet.'); return; }

            try {
                var userResult = await _supabaseClient.from('users').select('*').eq('email', email).eq('role', role).maybeSingle();
                var user = userResult.data;
                var userErr = userResult.error;

                if (userErr) throw userErr;
                if (!user) {
                    alert('No ' + role + ' account found with this email.');
                    return;
                }

                var exResult = await _supabaseClient.from('password_resets').select('*').eq('email', email).eq('role', role).eq('status', 'pending').maybeSingle();
                var existing = exResult.data;
                var exErr = exResult.error;

                if (exErr) throw exErr;
                if (existing) {
                    alert('You already have a pending reset request. Please wait for admin approval.');
                    closeResetModal();
                    return;
                }

                var insResult = await _supabaseClient.from('password_resets').insert({
                    id: 'RST' + Date.now().toString(36).toUpperCase(),
                    role: role,
                    name: user.name,
                    email: email,
                    status: 'pending',
                    requested_at: new Date().toISOString()
                });
                if (insResult.error) throw insResult.error;

                alert('Password reset request sent to admin. You will receive your new password once the admin approves your request.');
                closeResetModal();
                document.getElementById('resetForm').reset();
            } catch (err) {
                console.error(err);
                alert('Something went wrong. Please try again.');
            }
        }
        async function handleTeacherReg(e) {
            e.preventDefault();
            const name = document.getElementById('trName').value.trim();
            const email = document.getElementById('trEmail').value.trim();
            const subject = document.getElementById('trSubject').value.trim();
            const phone = document.getElementById('trPhone').value.trim();
            const password = document.getElementById('trPassword').value;

            try {
                const data = await signUp(email, password, { name: name, role: 'teacher', subject: subject, phone: phone });
                localStorage.setItem('tba_currentUser', JSON.stringify(data.user));
                sendCongratsEmail(email, name, 'teacher');
                sendNotifToAdmin('New Teacher Registered', name + ' (' + email + ') has created a teacher account.');
                alert('Registration successful! Redirecting to your dashboard...');
                closeTeacherReg();
                window.location.href = 'teacher-dashboard.html';
            } catch (err) {
                console.error(err);
                alert(err.message || 'Registration failed. Please try again.');
            }
        }

        // Admin Registration Modal
        document.body.insertAdjacentHTML('beforeend', `
        <div id="adminRegModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;justify-content:center;align-items:center">
            <div style="background:#fff;border-radius:20px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;margin:20px;animation:fadeIn .3s ease">
                <div style="padding:25px 30px;border-bottom:1px solid #e9ecef;display:flex;justify-content:space-between;align-items:center">
                    <h3 style="font-size:1.3rem;color:var(--dark)">Admin Registration</h3>
                    <button onclick="closeAdminReg()" style="background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--gray)">&times;</button>
                </div>
                <div style="padding:30px">
                    <form id="adminRegForm" onsubmit="handleAdminReg(event)">
                        <div style="margin-bottom:18px">
                            <label style="display:block;margin-bottom:6px;font-weight:600;font-size:.9rem;color:var(--dark)">Full Name *</label>
                            <input type="text" id="arName" placeholder="Enter your full name" required style="width:100%;padding:12px 15px;border:2px solid #e9ecef;border-radius:10px;font-family:inherit;font-size:.9rem">
                        </div>
                        <div style="margin-bottom:18px">
                            <label style="display:block;margin-bottom:6px;font-weight:600;font-size:.9rem;color:var(--dark)">Email Address *</label>
                            <input type="email" id="arEmail" placeholder="Enter admin email" required style="width:100%;padding:12px 15px;border:2px solid #e9ecef;border-radius:10px;font-family:inherit;font-size:.9rem">
                        </div>
                        <div style="margin-bottom:18px">
                            <label style="display:block;margin-bottom:6px;font-weight:600;font-size:.9rem;color:var(--dark)">Password *</label>
                            <div style="position:relative">
                                <input type="password" id="arPassword" placeholder="Create a password (min 6 chars)" minlength="6" required style="width:100%;padding:12px 50px 12px 15px;border:2px solid #e9ecef;border-radius:10px;font-family:inherit;font-size:.9rem">
                                <i id="arEyeIcon" class="fa-solid fa-eye" onclick="togglePassword('arPassword','arEyeIcon')" style="position:absolute;right:15px;top:50%;transform:translateY(-50%);color:#1e40af;cursor:pointer;font-size:1.1rem"></i>
                            </div>
                        </div>
                        <button type="submit" style="width:100%;padding:14px;background:var(--gradient);color:#fff;border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer"><i class="fa-solid fa-shield-halved"></i> Create Admin Account</button>
                    </form>
                </div>
            </div>
        </div>`);

        function showAdminReg() {
            document.getElementById('adminRegModal').style.display = 'flex';
        }
        function closeAdminReg() {
            document.getElementById('adminRegModal').style.display = 'none';
        }
        async function handleAdminReg(e) {
            e.preventDefault();
            const name = document.getElementById('arName').value.trim();
            const email = document.getElementById('arEmail').value.trim();
            const password = document.getElementById('arPassword').value;

            try {
                const data = await signUp(email, password, { name: name, role: 'admin' });
                localStorage.setItem('tba_currentUser', JSON.stringify(data.user));
                sendCongratsEmail(email, name, 'admin');
                alert('Admin account created! Redirecting to dashboard...');
                closeAdminReg();
                window.location.href = 'admin-dashboard.html';
            } catch (err) {
                console.error(err);
                alert(err.message || 'Registration failed. Please try again.');
            }
        }

        // Show admin registration link
        document.getElementById('adminRegLink').style.display = 'block';

        function switchRole(role) {
            currentRole = role;
            document.getElementById('studentBtn').classList.toggle('active', role === 'student');
            document.getElementById('teacherBtn').classList.toggle('active', role === 'teacher');
            document.getElementById('adminBtn').classList.toggle('active', role === 'admin');
            document.getElementById('loginError').style.display = 'none';

            const nameGroup = document.getElementById('nameGroup');
            const classGroup = document.getElementById('classGroup');

            if (role === 'admin') {
                nameGroup.style.display = 'none';
                classGroup.style.display = 'none';
            } else if (role === 'teacher') {
                nameGroup.style.display = 'none';
                classGroup.style.display = 'none';
            } else {
                nameGroup.style.display = 'block';
                classGroup.style.display = 'block';
                document.getElementById('nameLabel').textContent = 'Student Full Name *';
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const name = document.getElementById('loginName').value.trim();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const selectedClass = document.getElementById('loginClass').value;
            const errorEl = document.getElementById('loginError');
            errorEl.style.display = 'none';

            if (!email || !password) {
                errorEl.textContent = 'Please enter email and password.';
                errorEl.style.display = 'block';
                return;
            }

            try {
                const data = await signIn(email, password);
                const profile = data.user;

                if (currentRole === 'student') {
                    if (!selectedClass) {
                        errorEl.textContent = 'Please select your class.';
                        errorEl.style.display = 'block';
                        return;
                    }
                    if (profile.role === 'student' && profile.class === selectedClass) {
                        localStorage.setItem('tba_currentUser', JSON.stringify(profile));
                        window.location.href = 'student-dashboard.html';
                    } else {
                        errorEl.textContent = 'Invalid email, password, or class.';
                        errorEl.style.display = 'block';
                    }
                } else if (currentRole === 'teacher') {
                    if (profile.role === 'teacher') {
                        localStorage.setItem('tba_currentUser', JSON.stringify(profile));
                        window.location.href = 'teacher-dashboard.html';
                    } else {
                        errorEl.textContent = 'This account is not a teacher account.';
                        errorEl.style.display = 'block';
                    }
                } else {
                    if (profile.role === 'admin') {
                        localStorage.setItem('tba_currentUser', JSON.stringify(profile));
                        window.location.href = 'admin-dashboard.html';
                    } else {
                        errorEl.textContent = 'This account is not an admin account.';
                        errorEl.style.display = 'block';
                    }
                }
            } catch (err) {
                console.error(err);
                errorEl.textContent = err.message || 'Invalid email or password.';
                errorEl.style.display = 'block';
            }
        }

    </script>
</body>
</html>
