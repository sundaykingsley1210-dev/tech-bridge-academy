<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TECH-BRIDGE ACADEMY</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/1ee35b433b.js" crossorigin="anonymous"></script>
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e40af 0%, #7c3aed 100%);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        .login-page::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: rgba(255,255,255,0.05);
            border-radius: 50%;
            top: -100px;
            right: -100px;
        }
        .login-page::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255,255,255,0.05);
            border-radius: 50%;
            bottom: -50px;
            left: -50px;
        }
        .login-container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 450px;
            overflow: hidden;
            position: relative;
            z-index: 1;
        }
        .login-header {
            background: var(--gradient);
            padding: 40px 40px 30px;
            text-align: center;
            color: white;
        }
        .login-header img {
            height: 50px;
            margin-bottom: 15px;
        }
        .login-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 5px;
        }
        .login-header p {
            opacity: 0.85;
            font-size: 0.9rem;
        }
        .role-toggle {
            display: flex;
            margin: 25px 40px 0;
            background: #f1f3f5;
            border-radius: 12px;
            overflow: hidden;
        }
        .role-btn {
            flex: 1;
            padding: 12px 8px;
            border: none;
            background: transparent;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
            color: var(--gray);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .role-btn.active {
            background: var(--gradient);
            color: white;
            border-radius: 12px;
        }
        .login-body {
            padding: 30px 40px 40px;
        }
        .login-body .form-group {
            margin-bottom: 20px;
        }
        .login-body .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--dark);
        }
        .login-body .form-group .input-wrapper {
            position: relative;
        }
        .login-body .form-group .input-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray);
        }
        .login-body .form-group input {
            width: 100%;
            padding: 14px 15px 14px 45px;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            font-family: inherit;
            font-size: 0.95rem;
            transition: var(--transition);
        }
        .login-body .form-group input:focus {
            outline: none;
            border-color: var(--primary);
        }
        .login-error {
            background: #fff5f5;
            color: #e53e3e;
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            display: none;
            border-left: 4px solid #e53e3e;
        }
        .login-btn {
            width: 100%;
            padding: 15px;
            background: var(--gradient);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        .login-footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e9ecef;
        }
        .login-footer a {
            color: var(--primary);
            font-weight: 600;
            font-size: 0.9rem;
        }
        .login-footer p {
            color: var(--gray);
            font-size: 0.85rem;
            margin-top: 10px;
        }
        .back-home {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 10;
            transition: var(--transition);
        }
        .back-home:hover {
            opacity: 0.8;
        }
        @media (max-width: 480px) {
            .login-header, .login-body, .role-toggle {
                margin-left: 20px;
                margin-right: 20px;
            }
            .role-toggle {
                margin-left: 20px;
                margin-right: 20px;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-home">
        <i class="fa-solid fa-arrow-left"></i> Back to Home
    </a>

    <section class="login-page">
        <div class="login-container">
            <div class="login-header">
                <img src="logo.svg" alt="TECH-BRIDGE ACADEMY">
                <h1>Welcome Back</h1>
                <p>Sign in to your portal</p>
            </div>

            <div class="role-toggle">
                <button class="role-btn active" id="studentBtn" onclick="switchRole('student')">
                    <i class="fa-solid fa-user-graduate"></i> Student
                </button>
                <button class="role-btn" id="teacherBtn" onclick="switchRole('teacher')">
                    <i class="fa-solid fa-chalkboard-user"></i> Teacher
                </button>
                <button class="role-btn" id="adminBtn" onclick="switchRole('admin')">
                    <i class="fa-solid fa-shield-halved"></i> Admin
                </button>
            </div>

            <div class="login-body">
                <div class="login-error" id="loginError"></div>
                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="form-group" id="nameGroup">
                        <label id="nameLabel">Full Name</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-id-card"></i>
                            <input type="text" id="loginName" placeholder="Enter your full name">
                        </div>
                    </div>
                    <div class="form-group">
                        <label id="emailLabel">Email Address</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-user"></i>
                            <input type="email" id="loginEmail" placeholder="Enter your email" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="loginPassword" placeholder="Enter your password" required>
                        </div>
                    </div>
                    <button type="submit" class="login-btn">
                        <i class="fa-solid fa-sign-in-alt"></i> Sign In
                    </button>
                </form>

                <div class="login-footer">
                    <a href="admission.html">New Student? Apply for Admission</a>
                    <p style="margin-top:8px"><a href="#" onclick="showTeacherReg()" style="color:var(--primary);font-weight:600;font-size:.9rem">New Teacher? Register Here</a></p>
                    <p id="adminRegLink" style="margin-top:8px;display:none"><a href="#" onclick="showAdminReg()" style="color:var(--primary);font-weight:600;font-size:.9rem">Setup Admin Account</a></p>
                    <p>Having trouble? Contact <a href="https://wa.me/2348039392007" style="color: var(--accent);">Support</a></p>
                </div>
            </div>
        </div>
    </section>

    <script>
        let currentRole = 'student';

        // Teacher Registration Modal
        document.body.insertAdjacentHTML('beforeend', `
        <div id="teacherRegModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;justify-content:center;align-items:center">
            <div style="background:#fff;border-radius:20px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;margin:20px;animation:fadeIn .3s ease">
                <div style="padding:25px 30px;border-bottom:1px solid #e9ecef;display:flex;justify-content:space-between;align-items:center">
                    <h3 style="font-size:1.3rem;color:var(--dark)">Teacher Registration</h3>
                    <button onclick="closeTeacherReg()" style="background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--gray)">&times;</button>
                </div>
                <div style="padding:30px">
                    <form id="teacherRegForm" onsubmit="handleTeacherReg(event)">
                        <div style="margin-bottom:18px">
                            <label style="display:block;margin-bottom:6px;font-weight:600;font-size:.9rem;color:var(--dark)">Full Name *</label>
                            <input type="text" id="trName" placeholder="Enter your full name" required style="width:100%;padding:12px 15px;border:2px solid #e9ecef;border-radius:10px;font-family:inherit;font-size:.9rem">
                        </div>
                        <div style="margin-bottom:18px">
                            <label style="display:block;margin-bottom:6px;font-weight:600;font-size:.9rem;color:var(--dark)">Email Address *</label>
                            <input type="email" id="trEmail" placeholder="Enter your email" required style="width:100%;padding:12px 15px;border:2px solid #e9ecef;border-radius:10px;font-family:inherit;font-size:.9rem">
                        </div>
                        <div style="margin-bottom:18px">
                            <label style="display:block;margin-bottom:6px;font-weight:600;font-size:.9rem;color:var(--dark)">Subject *</label>
                            <input type="text" id="trSubject" placeholder="e.g. Mathematics" required style="width:100%;padding:12px 15px;border:2px solid #e9ecef;border-radius:10px;font-family:inherit;font-size:.9rem">
                        </div>
                        <div style="margin-bottom:18px">
                            <label style="display:block;margin-bottom:6px;font-weight:600;font-size:.9rem;color:var(--dark)">Phone Number</label>
                            <input type="tel" id="trPhone" placeholder="e.g. 08012345678" style="width:100%;padding:12px 15px;border:2px solid #e9ecef;border-radius:10px;font-family:inherit;font-size:.9rem">
                        </div>
                        <div style="margin-bottom:18px">
                            <label style="display:block;margin-bottom:6px;font-weight:600;font-size:.9rem;color:var(--dark)">Password *</label>
                            <input type="password" id="trPassword" placeholder="Create a password (min 6 chars)" minlength="6" required style="width:100%;padding:12px 15px;border:2px solid #e9ecef;border-radius:10px;font-family:inherit;font-size:.9rem">
                        </div>
                        <button type="submit" style="width:100%;padding:14px;background:var(--gradient);color:#fff;border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer"><i class="fa-solid fa-user-plus"></i> Register</button>
                    </form>
                </div>
            </div>
        </div>`);

        function showTeacherReg() {
            document.getElementById('teacherRegModal').style.display = 'flex';
        }
        function closeTeacherReg() {
            document.getElementById('teacherRegModal').style.display = 'none';
        }
        function handleTeacherReg(e) {
            e.preventDefault();
            const name = document.getElementById('trName').value.trim();
            const email = document.getElementById('trEmail').value.trim();
            const subject = document.getElementById('trSubject').value.trim();
            const phone = document.getElementById('trPhone').value.trim();
            const password = document.getElementById('trPassword').value;
            let users = JSON.parse(localStorage.getItem('tba_users') || '[]');
            if (users.some(u => u.email === email)) {
                alert('This email is already registered. Please login.');
                return;
            }
            const newId = 'TCH' + String(users.filter(u => u.role === 'teacher').length + 1).padStart(3, '0');
            users.push({
                id: newId,
                email: email,
                password: password,
                name: name,
                role: 'teacher',
                subject: subject,
                phone: phone
            });
            localStorage.setItem('tba_users', JSON.stringify(users));
            alert('Registration successful! You can now login with your email and password.');
            closeTeacherReg();
            document.getElementById('teacherRegForm').reset();
        }

        // Admin Registration Modal
        document.body.insertAdjacentHTML('beforeend', `
        <div id="adminRegModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;justify-content:center;align-items:center">
            <div style="background:#fff;border-radius:20px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;margin:20px;animation:fadeIn .3s ease">
                <div style="padding:25px 30px;border-bottom:1px solid #e9ecef;display:flex;justify-content:space-between;align-items:center">
                    <h3 style="font-size:1.3rem;color:var(--dark)">Admin Registration</h3>
                    <button onclick="closeAdminReg()" style="background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--gray)">&times;</button>
                </div>
                <div style="padding:30px">
                    <form id="adminRegForm" onsubmit="handleAdminReg(event)">
                        <div style="margin-bottom:18px">
                            <label style="display:block;margin-bottom:6px;font-weight:600;font-size:.9rem;color:var(--dark)">Full Name *</label>
                            <input type="text" id="arName" placeholder="Enter your full name" required style="width:100%;padding:12px 15px;border:2px solid #e9ecef;border-radius:10px;font-family:inherit;font-size:.9rem">
                        </div>
                        <div style="margin-bottom:18px">
                            <label style="display:block;margin-bottom:6px;font-weight:600;font-size:.9rem;color:var(--dark)">Email Address *</label>
                            <input type="email" id="arEmail" placeholder="Enter admin email" required style="width:100%;padding:12px 15px;border:2px solid #e9ecef;border-radius:10px;font-family:inherit;font-size:.9rem">
                        </div>
                        <div style="margin-bottom:18px">
                            <label style="display:block;margin-bottom:6px;font-weight:600;font-size:.9rem;color:var(--dark)">Password *</label>
                            <input type="password" id="arPassword" placeholder="Create a password (min 6 chars)" minlength="6" required style="width:100%;padding:12px 15px;border:2px solid #e9ecef;border-radius:10px;font-family:inherit;font-size:.9rem">
                        </div>
                        <button type="submit" style="width:100%;padding:14px;background:var(--gradient);color:#fff;border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer"><i class="fa-solid fa-shield-halved"></i> Create Admin Account</button>
                    </form>
                </div>
            </div>
        </div>`);

        function showAdminReg() {
            document.getElementById('adminRegModal').style.display = 'flex';
        }
        function closeAdminReg() {
            document.getElementById('adminRegModal').style.display = 'none';
        }
        function handleAdminReg(e) {
            e.preventDefault();
            const name = document.getElementById('arName').value.trim();
            const email = document.getElementById('arEmail').value.trim();
            const password = document.getElementById('arPassword').value;
            let users = JSON.parse(localStorage.getItem('tba_users') || '[]');
            if (users.some(u => u.role === 'admin')) {
                alert('Admin account already exists.');
                return;
            }
            if (users.some(u => u.email === email)) {
                alert('This email is already registered.');
                return;
            }
            users.push({
                id: 'ADM001',
                email: email,
                password: password,
                name: name,
                role: 'admin'
            });
            localStorage.setItem('tba_users', JSON.stringify(users));
            alert('Admin account created! You can now login.');
            closeAdminReg();
            document.getElementById('adminRegForm').reset();
            document.getElementById('adminRegLink').style.display = 'none';
        }

        // Show admin registration link if no admin exists
        (function() {
            const users = JSON.parse(localStorage.getItem('tba_users') || '[]');
            if (!users.some(u => u.role === 'admin')) {
                document.getElementById('adminRegLink').style.display = 'block';
            }
        })();

        function switchRole(role) {
            currentRole = role;
            document.getElementById('studentBtn').classList.toggle('active', role === 'student');
            document.getElementById('teacherBtn').classList.toggle('active', role === 'teacher');
            document.getElementById('adminBtn').classList.toggle('active', role === 'admin');
            const labels = { student: 'Email Address', teacher: 'Email Address', admin: 'Admin Email' };
            const placeholders = { student: 'Enter your email', teacher: 'Enter your email', admin: 'Enter admin email' };
            const icons = { student: 'fa-user', teacher: 'fa-chalkboard-user', admin: 'fa-shield-halved' };
            document.getElementById('emailLabel').textContent = labels[role];
            document.getElementById('loginEmail').placeholder = placeholders[role];
            document.querySelector('#loginEmail').previousElementSibling.querySelector('i').className = 'fa-solid ' + icons[role];
            document.getElementById('loginError').style.display = 'none';

            const nameGroup = document.getElementById('nameGroup');
            if (role === 'admin') {
                nameGroup.style.display = 'none';
            } else {
                nameGroup.style.display = 'block';
                document.getElementById('nameLabel').textContent = role === 'teacher' ? 'Teacher Full Name' : 'Student Full Name';
                document.getElementById('loginName').placeholder = role === 'teacher' ? 'Enter your full name' : 'Enter your full name';
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const name = document.getElementById('loginName').value.trim();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const errorEl = document.getElementById('loginError');

            const users = JSON.parse(localStorage.getItem('tba_users') || '[]');
            let user = users.find(u => u.email === email && u.password === password && u.role === currentRole);

            if (user) {
                if (currentRole !== 'admin' && name) {
                    user.name = name;
                    const userIndex = users.findIndex(u => u.email === email);
                    users[userIndex] = user;
                    localStorage.setItem('tba_users', JSON.stringify(users));
                }
                localStorage.setItem('tba_currentUser', JSON.stringify(user));
                const redirects = { student: 'student-dashboard.html', teacher: 'teacher-dashboard.html', admin: 'admin-dashboard.html' };
                window.location.href = redirects[user.role];
            } else {
                errorEl.textContent = 'Invalid credentials. Please check your email and password.';
                errorEl.style.display = 'block';
            }
        }

    </script>
</body>
</html>
