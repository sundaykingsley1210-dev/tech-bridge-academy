<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TECH-BRIDGE ACADEMY</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/1ee35b433b.js" crossorigin="anonymous"></script>
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        .login-page::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: rgba(255,255,255,0.05);
            border-radius: 50%;
            top: -100px;
            right: -100px;
        }
        .login-page::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255,255,255,0.05);
            border-radius: 50%;
            bottom: -50px;
            left: -50px;
        }
        .login-container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 450px;
            overflow: hidden;
            position: relative;
            z-index: 1;
        }
        .login-header {
            background: var(--gradient);
            padding: 40px 40px 30px;
            text-align: center;
            color: white;
        }
        .login-header img {
            height: 50px;
            margin-bottom: 15px;
        }
        .login-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 5px;
        }
        .login-header p {
            opacity: 0.85;
            font-size: 0.9rem;
        }
        .role-toggle {
            display: flex;
            margin: 25px 40px 0;
            background: #f1f3f5;
            border-radius: 12px;
            overflow: hidden;
        }
        .role-btn {
            flex: 1;
            padding: 12px 8px;
            border: none;
            background: transparent;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
            color: var(--gray);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .role-btn.active {
            background: var(--gradient);
            color: white;
            border-radius: 12px;
        }
        .login-body {
            padding: 30px 40px 40px;
        }
        .login-body .form-group {
            margin-bottom: 20px;
        }
        .login-body .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--dark);
        }
        .login-body .form-group .input-wrapper {
            position: relative;
        }
        .login-body .form-group .input-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray);
        }
        .login-body .form-group input {
            width: 100%;
            padding: 14px 15px 14px 45px;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            font-family: inherit;
            font-size: 0.95rem;
            transition: var(--transition);
        }
        .login-body .form-group input:focus {
            outline: none;
            border-color: var(--primary);
        }
        .login-error {
            background: #fff5f5;
            color: #e53e3e;
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            display: none;
            border-left: 4px solid #e53e3e;
        }
        .login-btn {
            width: 100%;
            padding: 15px;
            background: var(--gradient);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        .login-footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e9ecef;
        }
        .login-footer a {
            color: var(--primary);
            font-weight: 600;
            font-size: 0.9rem;
        }
        .login-footer p {
            color: var(--gray);
            font-size: 0.85rem;
            margin-top: 10px;
        }
        .demo-credentials {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 12px;
            font-size: 0.8rem;
            color: var(--gray);
        }
        .demo-credentials h4 {
            color: var(--dark);
            margin-bottom: 8px;
            font-size: 0.85rem;
        }
        .demo-credentials code {
            background: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.8rem;
        }
        .back-home {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 10;
            transition: var(--transition);
        }
        .back-home:hover {
            opacity: 0.8;
        }
        @media (max-width: 480px) {
            .login-header, .login-body, .role-toggle {
                margin-left: 20px;
                margin-right: 20px;
            }
            .role-toggle {
                margin-left: 20px;
                margin-right: 20px;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-home">
        <i class="fa-solid fa-arrow-left"></i> Back to Home
    </a>

    <section class="login-page">
        <div class="login-container">
            <div class="login-header">
                <img src="logo.svg" alt="TECH-BRIDGE ACADEMY">
                <h1>Welcome Back</h1>
                <p>Sign in to your portal</p>
            </div>

            <div class="role-toggle">
                <button class="role-btn active" id="studentBtn" onclick="switchRole('student')">
                    <i class="fa-solid fa-user-graduate"></i> Student
                </button>
                <button class="role-btn" id="teacherBtn" onclick="switchRole('teacher')">
                    <i class="fa-solid fa-chalkboard-user"></i> Teacher
                </button>
                <button class="role-btn" id="adminBtn" onclick="switchRole('admin')">
                    <i class="fa-solid fa-shield-halved"></i> Admin
                </button>
            </div>

            <div class="login-body">
                <div class="login-error" id="loginError"></div>
                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="form-group" id="nameGroup">
                        <label id="nameLabel">Full Name</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-id-card"></i>
                            <input type="text" id="loginName" placeholder="Enter your full name" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label id="emailLabel">Student ID or Email</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-user"></i>
                            <input type="text" id="loginEmail" placeholder="e.g. student@tba.edu.ng" required>
                        </div>
                    </div>
                    <div class="form-group" id="classGroup">
                        <label>Select Your Class</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-layer-group"></i>
                            <select id="loginClass" required style="width:100%;padding:14px 15px 14px 45px;border:2px solid #e9ecef;border-radius:12px;font-family:inherit;font-size:0.95rem;transition:var(--transition);appearance:none;background:white url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2212%22 height=%2212%22 viewBox=%220 0 12 12%22><path fill=%22%23999%22 d=%22M6 8L1 3h10z%22/></svg>') no-repeat right 15px center">
                                <option value="">Select Class</option>
                                <option>JSS 1</option>
                                <option>JSS 2</option>
                                <option>JSS 3</option>
                                <option>SSS 1</option>
                                <option>SSS 2</option>
                                <option>SSS 3</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="loginPassword" placeholder="Enter your password" required>
                        </div>
                    </div>
                    <button type="submit" class="login-btn">
                        <i class="fa-solid fa-sign-in-alt"></i> Sign In
                    </button>
                </form>

                <div class="demo-credentials">
                    <h4>Demo Accounts (for testing):</h4>
                    <p><strong>Student:</strong> <code>student@tba.edu.ng</code> / <code>student123</code></p>
                    <p><strong>Teacher:</strong> <code>teacher@tba.edu.ng</code> / <code>teacher123</code></p>
                    <p><strong>Admin:</strong> <code>admin@tba.edu.ng</code> / <code>admin123</code></p>
                    <p style="margin-top:10px"><a href="#" onclick="resetAllData()" style="color:#e53e3e;font-size:.75rem">Reset All Demo Data</a></p>
                </div>

                <div class="login-footer">
                    <a href="admission.html">New Student? Apply for Admission</a>
                    <p>Having trouble? Contact <a href="https://wa.me/2348039392007" style="color: var(--accent);">Support</a></p>
                </div>
            </div>
        </div>
    </section>

    <script>
        let currentRole = 'student';

        function switchRole(role) {
            currentRole = role;
            document.getElementById('studentBtn').classList.toggle('active', role === 'student');
            document.getElementById('teacherBtn').classList.toggle('active', role === 'teacher');
            document.getElementById('adminBtn').classList.toggle('active', role === 'admin');
            const labels = { student: 'Student ID or Email', teacher: 'Teacher ID or Email', admin: 'Admin Email' };
            const placeholders = { student: 'e.g. student@tba.edu.ng', teacher: 'e.g. teacher@tba.edu.ng', admin: 'e.g. admin@tba.edu.ng' };
            const icons = { student: 'fa-user', teacher: 'fa-chalkboard-user', admin: 'fa-shield-halved' };
            document.getElementById('emailLabel').textContent = labels[role];
            document.getElementById('loginEmail').placeholder = placeholders[role];
            document.querySelector('#loginEmail').previousElementSibling.querySelector('i').className = 'fa-solid ' + icons[role];
            document.getElementById('loginError').style.display = 'none';

            const nameGroup = document.getElementById('nameGroup');
            const classGroup = document.getElementById('classGroup');
            if (role === 'admin') {
                nameGroup.style.display = 'none';
                classGroup.style.display = 'none';
            } else if (role === 'teacher') {
                nameGroup.style.display = 'block';
                classGroup.style.display = 'none';
                const nameLabels = { student: 'Student Full Name', teacher: 'Teacher Full Name' };
                const namePlaceholders = { student: 'Enter your full name', teacher: 'Enter your full name' };
                document.getElementById('nameLabel').textContent = nameLabels[role];
                document.getElementById('loginName').placeholder = namePlaceholders[role];
            } else {
                nameGroup.style.display = 'block';
                classGroup.style.display = 'block';
                document.getElementById('nameLabel').textContent = 'Student Full Name';
                document.getElementById('loginName').placeholder = 'Enter your full name';
            }
        }

        function seedDemoUsers() {
            let users = JSON.parse(localStorage.getItem('tba_users')) || [];

            const demoUsers = [
                { id: 'STU001', email: 'student@tba.edu.ng', password: 'student123', name: 'Adebayo Johnson', role: 'student', class: 'JSS 2', gender: 'Male' },
                { id: 'STU002', email: 'ama@student.tba.edu.ng', password: 'student123', name: 'Amaka Nwosu', role: 'student', class: 'SSS 1', gender: 'Female' },
                { id: 'TCH001', email: 'teacher@tba.edu.ng', password: 'teacher123', name: 'Mr. Chukwuemeka Obi', role: 'teacher', subject: 'Mathematics' },
                { id: 'TCH002', email: 'fatima@teacher.tba.edu.ng', password: 'teacher123', name: 'Mrs. Fatima Abdul', role: 'teacher', subject: 'English Language' },
                { id: 'ADM001', email: 'admin@tba.edu.ng', password: 'admin123', name: 'Admin Pa-Kings', role: 'admin' }
            ];

            demoUsers.forEach(demo => {
                const exists = users.some(u => u.email === demo.email);
                if (!exists) {
                    users.push(demo);
                }
            });

            localStorage.setItem('tba_users', JSON.stringify(users));
        }

        function handleLogin(e) {
            e.preventDefault();
            const name = document.getElementById('loginName').value.trim();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const loginClass = document.getElementById('loginClass').value;
            const errorEl = document.getElementById('loginError');

            if (currentRole === 'student' && !loginClass) {
                errorEl.textContent = 'Please select your class.';
                errorEl.style.display = 'block';
                return;
            }

            const users = JSON.parse(localStorage.getItem('tba_users') || '[]');
            let user = users.find(u => u.email === email && u.password === password && u.role === currentRole);

            if (user) {
                if (currentRole !== 'admin' && name) {
                    user.name = name;
                    const userIndex = users.findIndex(u => u.email === email);
                    users[userIndex] = user;
                    localStorage.setItem('tba_users', JSON.stringify(users));
                }
                if (currentRole === 'student' && loginClass) {
                    user.class = loginClass;
                    const userIndex = users.findIndex(u => u.email === email);
                    users[userIndex] = user;
                    localStorage.setItem('tba_users', JSON.stringify(users));
                }
                localStorage.setItem('tba_currentUser', JSON.stringify(user));
                const redirects = { student: 'student-dashboard.html', teacher: 'teacher-dashboard.html', admin: 'admin-dashboard.html' };
                window.location.href = redirects[user.role];
            } else {
                errorEl.textContent = 'Invalid credentials. Please check your email and password.';
                errorEl.style.display = 'block';
            }
        }

        function resetAllData() {
            if (confirm('This will clear all demo data and reset. Continue?')) {
                localStorage.removeItem('tba_users');
                localStorage.removeItem('tba_currentUser');
                localStorage.removeItem('tba_applications');
                localStorage.removeItem('tba_assignments');
                localStorage.removeItem('tba_submissions');
                localStorage.removeItem('tba_notifications');
                localStorage.removeItem('tba_fees');
                localStorage.removeItem('tba_payments');
                localStorage.removeItem('tba_exam_results');
                localStorage.removeItem('tba_exam_schedule');
                seedDemoUsers();
                alert('All data reset! Demo accounts restored.');
            }
        }

        seedDemoUsers();
    </script>
</body>
</html>
