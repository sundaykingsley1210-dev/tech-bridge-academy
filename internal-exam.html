<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal Exam - TECH-BRIDGE ACADEMY</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/1ee35b433b.js" crossorigin="anonymous"></script>
    <style>
        body{background:#f1f3f5;font-family:'Inter',sans-serif}
        .exam-container{max-width:800px;margin:0 auto;padding:30px 20px}
        .exam-header{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;padding:40px;border-radius:20px;margin-bottom:30px;text-align:center}
        .exam-header img{height:50px;margin-bottom:15px}
        .exam-header h1{font-size:1.8rem;margin-bottom:10px}
        .exam-header p{opacity:.85}
        .exam-timer{display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,.2);padding:12px 25px;border-radius:30px;font-size:1.3rem;font-weight:700;margin-top:20px}
        .exam-timer i{font-size:1.1rem}
        .exam-info{background:#fff;padding:30px;border-radius:16px;box-shadow:0 2px 15px rgba(0,0,0,.05);margin-bottom:25px}
        .exam-info h2{font-size:1.3rem;color:var(--dark);margin-bottom:15px}
        .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
        .info-item{padding:12px 15px;background:#f8f9fa;border-radius:10px}
        .info-item label{font-size:.75rem;color:var(--gray);display:block;margin-bottom:3px}
        .info-item p{font-weight:600;color:var(--dark);margin:0;font-size:.95rem}
        .exam-rules{padding:20px;background:#fff3cd;border-radius:12px;margin-top:20px}
        .exam-rules h4{color:#856404;margin-bottom:10px;font-size:.95rem}
        .exam-rules ul{margin:0;padding-left:20px;color:#856404;font-size:.88rem}
        .exam-rules li{margin-bottom:5px}
        .question-card{background:#fff;padding:30px;border-radius:16px;box-shadow:0 2px 15px rgba(0,0,0,.05);margin-bottom:20px}
        .question-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
        .question-num{background:var(--gradient);color:#fff;padding:6px 14px;border-radius:20px;font-weight:700;font-size:.85rem}
        .question-text{font-size:1.05rem;color:var(--dark);line-height:1.6;margin-bottom:20px;font-weight:500}
        .options{display:flex;flex-direction:column;gap:10px}
        .option{display:flex;align-items:center;gap:12px;padding:14px 18px;background:#f8f9fa;border-radius:10px;cursor:pointer;transition:var(--transition);border:2px solid transparent}
        .option:hover{background:#f0f3ff;border-color:var(--primary)}
        .option.selected{background:#e8f4fd;border-color:var(--primary)}
        .option input[type="radio"]{width:18px;height:18px;accent-color:var(--primary)}
        .option label{cursor:pointer;font-size:.95rem;color:var(--dark);flex:1}
        .exam-actions{display:flex;gap:15px;justify-content:center;margin-top:30px}
        .btn-submit-exam{background:linear-gradient(135deg,#38ef7d 0%,#11998e 100%);color:#fff;border:none;padding:16px 40px;border-radius:12px;font-size:1.1rem;font-weight:700;cursor:pointer;transition:var(--transition)}
        .btn-submit-exam:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(56,239,125,.4)}
        .btn-back{background:#f1f3f5;color:var(--dark);border:none;padding:16px 30px;border-radius:12px;font-size:1rem;font-weight:600;cursor:pointer;transition:var(--transition)}
        .btn-back:hover{background:#e9ecef}
        .progress-bar{width:100%;height:8px;background:#e9ecef;border-radius:10px;margin-bottom:25px;overflow:hidden}
        .progress-fill{height:100%;background:var(--gradient);border-radius:10px;transition:width .3s ease}
        .result-card{text-align:center;padding:50px 30px}
        .result-card .result-icon{font-size:5rem;margin-bottom:20px}
        .result-card h2{font-size:2rem;color:var(--dark);margin-bottom:10px}
        .result-card .score{font-size:3rem;font-weight:800;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:20px 0}
        .result-card p{color:var(--gray);font-size:1rem;line-height:1.6;max-width:500px;margin:0 auto 20px}
        .result-card .verdict{padding:15px 25px;border-radius:12px;font-weight:700;font-size:1.1rem;display:inline-block;margin-bottom:20px}
        .verdict-pass{background:#d4edda;color:#155724}
        .verdict-fail{background:#f8d7da;color:#721c24}
        .locked-page{text-align:center;padding:80px 30px}
        .locked-page i{font-size:5rem;color:var(--gray);opacity:.3;margin-bottom:20px}
        .locked-page h2{color:var(--dark);margin-bottom:10px}
        .locked-page p{color:var(--gray);max-width:400px;margin:0 auto}
        .class-select-card{background:#fff;padding:40px;border-radius:16px;box-shadow:0 2px 15px rgba(0,0,0,.05);text-align:center}
        .class-select-card h2{color:var(--dark);margin-bottom:10px}
        .class-select-card p{color:var(--gray);margin-bottom:25px}
        .class-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:500px;margin:0 auto}
        .class-btn{padding:16px;border:2px solid #e9ecef;border-radius:12px;background:#fff;font-family:inherit;font-weight:700;font-size:1rem;color:var(--dark);cursor:pointer;transition:var(--transition)}
        .class-btn:hover{border-color:var(--primary);background:#f0f3ff;transform:translateY(-2px)}
        @media(max-width:600px){.info-grid{grid-template-columns:1fr}.exam-header{padding:30px 20px}.exam-header h1{font-size:1.4rem}.class-grid{grid-template-columns:repeat(2,1fr)}}
    </style>
</head>

        let currentQuestion = 0;

        function init() {
            if (!currentUser || currentUser.role !== 'student') {
                showClassSelect();
                return;
            }
            showClassSelect();
        }

        function showClassSelect() {
            const classes = Object.keys(examBank);
            document.getElementById('examContent').innerHTML = `
                <div class="exam-header">
                    <img src="logo.svg" alt="TBA">
                    <h1>Internal Examination</h1>
                    <p>TECH-BRIDGE ACADEMY</p>
                </div>
                <div class="class-select-card">
                    <h2><i class="fa-solid fa-graduation-cap"></i> Select Your Class</h2>
                    <p>Choose your class to begin the examination. Each class has different questions.</p>
                    <div class="class-grid">
                        ${classes.map(cls => `
                            <button class="class-btn" onclick="startClassExam('${cls}')">${cls}</button>
                        `).join('')}
                    </div>
                </div>`;
        }

        function startClassExam(cls) {
            selectedClass = cls;
            currentExam = examBank[cls];
            currentQuestion = 0;
            answers = {};
            timeLeft = 30 * 60;
            renderExamIntro();
        }

        function renderExamIntro() {
            document.getElementById('examContent').innerHTML = `
                <div class="exam-header">
                    <img src="logo.svg" alt="TBA">
                    <h1>Internal Examination</h1>
                    <p>TECH-BRIDGE ACADEMY</p>
                    <div class="exam-timer"><i class="fa-solid fa-clock"></i> 30 Minutes | ${currentExam.length} Questions</div>
                </div>
                <div class="exam-info">
                    <h2><i class="fa-solid fa-circle-info"></i> Exam Information</h2>
                    <div class="info-grid">
                        <div class="info-item"><label>Student</label><p>${currentUser ? currentUser.name : 'Guest'}</p></div>
                        <div class="info-item"><label>Student ID</label><p>${currentUser ? currentUser.id : 'N/A'}</p></div>
                        <div class="info-item"><label>Class</label><p>${selectedClass}</p></div>
                        <div class="info-item"><label>Duration</label><p>30 Minutes</p></div>
                        <div class="info-item"><label>Total Questions</label><p>${currentExam.length}</p></div>
                        <div class="info-item"><label>Pass Mark</label><p>60%</p></div>
                    </div>
                    <div class="exam-rules">
                        <h4><i class="fa-solid fa-triangle-exclamation"></i> Exam Rules</h4>
                        <ul>
                            <li>This exam has ${currentExam.length} multiple choice questions</li>
                            <li>You have 30 minutes to complete the exam</li>
                            <li>The exam will auto-submit when time runs out</li>
                            <li>You can only take this exam once per class</li>
                            <li>Do not refresh or close the page during the exam</li>
                            <li>A score of 60% or above is required to pass</li>
                        </ul>
                    </div>
                    <div class="exam-actions">
                        <button class="btn-submit-exam" onclick="beginExam()"><i class="fa-solid fa-play"></i> Start Exam</button>
                        <button class="btn-back" onclick="showClassSelect()"><i class="fa-solid fa-arrow-left"></i> Back</button>
                    </div>
                </div>`;
        }

        function beginExam() {
            currentQuestion = 0;
            answers = {};
            timeLeft = 30 * 60;
            renderQuestion();
            startTimer();
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                const mins = Math.floor(timeLeft / 60);
                const secs = timeLeft % 60;
                const timerEl = document.getElementById('examTimer');
                if (timerEl) {
                    timerEl.textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
                }
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    submitExam();
                }
            }, 1000);
        }

        function renderQuestion() {
            const q = currentExam[currentQuestion];
            const progress = ((currentQuestion + 1) / currentExam.length) * 100;
            const answered = Object.keys(answers).length;

            document.getElementById('examContent').innerHTML = `
                <div class="exam-header" style="padding:25px 30px">
                    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px">
                        <div>
                            <h1 style="font-size:1.3rem;margin-bottom:3px">Internal Exam — ${selectedClass}</h1>
                            <p style="font-size:.85rem">${currentUser ? currentUser.name : 'Guest'} | ${currentUser ? currentUser.id : 'N/A'}</p>
                        </div>
                        <div class="exam-timer" style="margin-top:0;font-size:1.1rem;padding:10px 20px">
                            <i class="fa-solid fa-clock"></i> <span id="examTimer">${String(Math.floor(timeLeft/60)).padStart(2,'0')}:${String(timeLeft%60).padStart(2,'0')}</span>
                        </div>
                    </div>
                </div>
                <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
                <div style="display:flex;justify-content:space-between;margin-bottom:20px;font-size:.85rem;color:var(--gray)">
                    <span>Question ${currentQuestion + 1} of ${currentExam.length}</span>
                    <span>${answered} answered</span>
                </div>
                <div class="question-card">
                    <div class="question-header">
                        <span class="question-num">Q${currentQuestion + 1}</span>
                    </div>
                    <div class="question-text">${q.q}</div>
                    <div class="options">
                        ${q.options.map((opt, i) => `
                            <div class="option ${answers[currentQuestion] === i ? 'selected' : ''}" onclick="selectOption(${i})">
                                <input type="radio" name="q${currentQuestion}" id="opt${i}" ${answers[currentQuestion] === i ? 'checked' : ''}>
                                <label for="opt${i}">${opt}</label>
                            </div>
                        `).join('')}
                    </div>
                </div>
                <div class="exam-actions" style="justify-content:space-between">
                    <button class="btn-back" onclick="prevQuestion()" ${currentQuestion === 0 ? 'disabled style="opacity:.5;cursor:not-allowed"' : ''}>
                        <i class="fa-solid fa-arrow-left"></i> Previous
                    </button>
                    <div style="display:flex;gap:10px">
                        ${currentQuestion < currentExam.length - 1
                            ? `<button class="btn-submit-exam" onclick="nextQuestion()" style="padding:14px 30px;font-size:.95rem">Next <i class="fa-solid fa-arrow-right"></i></button>`
                            : `<button class="btn-submit-exam" onclick="submitExam()" style="padding:14px 30px;font-size:.95rem;background:linear-gradient(135deg,#38ef7d 0%,#11998e 100%)"><i class="fa-solid fa-paper-plane"></i> Submit Exam</button>`
                        }
                    </div>
                </div>
                <div style="display:flex;justify-content:center;gap:8px;margin-top:25px;flex-wrap:wrap">
                    ${currentExam.map((_, i) => `
                        <button onclick="goToQuestion(${i})" style="width:36px;height:36px;border-radius:8px;border:2px solid ${answers[i] !== undefined ? 'var(--primary)' : '#e9ecef'};background:${answers[i] !== undefined ? 'var(--gradient)' : '#fff'};color:${answers[i] !== undefined ? '#fff' : 'var(--gray)'};font-weight:600;font-size:.8rem;cursor:pointer;transition:var(--transition)">${i + 1}</button>
                    `).join('')}
                </div>`;
        }

        function selectOption(idx) {
            answers[currentQuestion] = idx;
            renderQuestion();
        }

        function nextQuestion() {
            if (currentQuestion < currentExam.length - 1) {
                currentQuestion++;
                renderQuestion();
                window.scrollTo(0, 0);
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                renderQuestion();
                window.scrollTo(0, 0);
            }
        }

        function goToQuestion(idx) {
            currentQuestion = idx;
            renderQuestion();
            window.scrollTo(0, 0);
        }

        function submitExam() {
            clearInterval(timerInterval);
            const unanswered = currentExam.length - Object.keys(answers).length;
            if (unanswered > 0 && timeLeft > 0) {
                if (!confirm(`You have ${unanswered} unanswered question(s). Submit anyway?`)) {
                    startTimer();
                    return;
                }
            }

            let score = 0;
            currentExam.forEach((q, i) => {
                if (answers[i] === q.answer) score++;
            });

            const percentage = Math.round((score / currentExam.length) * 100);
            const passed = percentage >= 60;

            const result = {
                studentId: currentUser ? currentUser.id : 'guest',
                studentName: currentUser ? currentUser.name : 'Guest',
                class: selectedClass,
                score: score,
                total: currentExam.length,
                percentage: percentage,
                passed: passed,
                date: new Date().toISOString()
            };

            let examResults = JSON.parse(localStorage.getItem('tba_exam_results') || '[]');
            examResults.push(result);
            localStorage.setItem('tba_exam_results', JSON.stringify(examResults));

            showResult(score, percentage, passed);
        }

        function showResult(score, percentage, passed) {
            document.getElementById('examContent').innerHTML = `
                <div class="exam-header">
                    <img src="logo.svg" alt="TBA">
                    <h1>Exam Complete!</h1>
                </div>
                <div class="exam-info">
                    <div class="result-card">
                        <div class="result-icon">${passed ? '&#127881;' : '&#128203;'}</div>
                        <h2>${passed ? 'Congratulations!' : 'Exam Completed'}</h2>
                        <div class="score">${score} / ${currentExam.length}</div>
                        <p>${passed
                            ? `You scored ${percentage}% which is above the required 60%. Well done!`
                            : `You scored ${percentage}% which is below the required 60%. Keep studying and try again!`
                        }</p>
                        <div class="verdict ${passed ? 'verdict-pass' : 'verdict-fail'}">
                            ${passed ? 'PASSED' : 'BELOW CUT-OFF'}
                        </div>
                        <div class="info-grid" style="max-width:400px;margin:20px auto 0;text-align:left">
                            <div class="info-item"><label>Student</label><p>${currentUser ? currentUser.name : 'Guest'}</p></div>
                            <div class="info-item"><label>Class</label><p>${selectedClass}</p></div>
                            <div class="info-item"><label>Score</label><p>${score}/${currentExam.length}</p></div>
                            <div class="info-item"><label>Percentage</label><p>${percentage}%</p></div>
                        </div>
                        <div class="exam-actions" style="margin-top:30px">
                            <button class="btn-submit-exam" onclick="showClassSelect()"><i class="fa-solid fa-arrow-left"></i> Back to Classes</button>
                            ${currentUser ? `<a href="student-dashboard.html" class="btn-back" style="text-decoration:none">Go to Dashboard</a>` : ''}
                        </div>
                    </div>
                </div>`;
        }

        init();
    </script>
</body>
</html>
