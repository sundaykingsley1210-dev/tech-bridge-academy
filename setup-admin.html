<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Admin - TECH-BRIDGE ACADEMY</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #1e40af, #7c3aed); padding: 20px; }
        .setup-card { background: #fff; border-radius: 20px; padding: 40px; max-width: 500px; width: 100%; box-shadow: 0 25px 80px rgba(0,0,0,0.2); }
        h1 { font-size: 1.5rem; color: #1a202c; margin-bottom: 10px; }
        p { color: #718096; font-size: 0.9rem; margin-bottom: 20px; }
        label { display: block; font-weight: 600; font-size: 0.85rem; color: #1a202c; margin-bottom: 6px; }
        input { width: 100%; padding: 12px 15px; border: 2px solid #e2e8f0; border-radius: 10px; font-family: inherit; font-size: 0.95rem; margin-bottom: 16px; box-sizing: border-box; }
        input:focus { outline: none; border-color: #1e40af; }
        button { width: 100%; padding: 14px; background: linear-gradient(135deg, #1e40af, #7c3aed); color: #fff; border: none; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: all 0.3s; }
        button:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(30,64,175,0.4); }
        button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .msg { padding: 12px 15px; border-radius: 10px; margin-bottom: 16px; font-size: 0.85rem; display: none; }
        .msg.success { background: #d4edda; color: #155724; border-left: 4px solid #155724; display: block; }
        .msg.error { background: #f8d7da; color: #721c24; border-left: 4px solid #721c24; display: block; }
        .msg.info { background: #d1ecf1; color: #0c5460; border-left: 4px solid #0c5460; display: block; }
        .back { text-align: center; margin-top: 16px; }
        .back a { color: #1e40af; font-weight: 600; font-size: 0.9rem; text-decoration: none; }
        .back a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="setup-card">
        <h1>Setup Admin Account</h1>
        <p>Create the first admin account for TECH-BRIDGE Academy. This account can manage all other users.</p>
        <div class="msg" id="msg"></div>
        <form onsubmit="createAdmin(event)">
            <label>Full Name *</label>
            <input type="text" id="name" placeholder="e.g. Dr. Admin" required>
            <label>Email *</label>
            <input type="email" id="email" placeholder="admin@techbridge.edu" required>
            <label>Password *</label>
            <input type="password" id="password" placeholder="Min 6 characters" minlength="6" required>
            <button type="submit" id="btn">Create Admin Account</button>
        </form>
        <div class="back"><a href="login.html">Back to Login</a></div>
    </div>
    <script>
        const SUPABASE_URL = 'https://ljhritlqicnlppwcoijw.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_jDqBNBJKoF6RmPgaXNTW-g_G92B6L92';
        let supabase = null;
        try { supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch(e) {}

        function showMsg(text, type) {
            const el = document.getElementById('msg');
            el.textContent = text;
            el.className = 'msg ' + type;
        }

        async function createAdmin(e) {
            e.preventDefault();
            const btn = document.getElementById('btn');
            btn.disabled = true;
            btn.textContent = 'Creating...';

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!supabase) {
                showMsg('Cannot connect to Supabase. Check your internet and refresh.', 'error');
                btn.disabled = false;
                btn.textContent = 'Create Admin Account';
                return;
            }

            try {
                // Step 1: Create auth user
                const { data, error } = await supabase.auth.signUp({ email, password });
                if (error) {
                    showMsg('Auth error: ' + error.message, 'error');
                    btn.disabled = false;
                    btn.textContent = 'Create Admin Account';
                    return;
                }
                if (!data.user) {
                    showMsg('User created but no user object returned. Check if email confirmation is enabled in Supabase and disable it.', 'error');
                    btn.disabled = false;
                    btn.textContent = 'Create Admin Account';
                    return;
                }

                // Step 2: Insert profile into users table
                const userId = data.user.id;
                const { error: profileError } = await supabase.from('users').upsert({
                    id: userId,
                    email: email,
                    name: name,
                    role: 'admin'
                });

                if (profileError) {
                    showMsg('Profile save error: ' + profileError.message + '. Auth account was created. Try logging in.', 'info');
                } else {
                    showMsg('Admin account created successfully! Email: ' + email + '. Redirecting to login...', 'success');
                    setTimeout(() => { window.location.href = 'login.html'; }, 2000);
                }
            } catch(err) {
                showMsg('Error: ' + err.message, 'error');
            }

            btn.disabled = false;
            btn.textContent = 'Create Admin Account';
        }
    </script>
</body>
</html>
