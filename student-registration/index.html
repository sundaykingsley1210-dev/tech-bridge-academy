<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Student Registration</h1>
    <p class="subtitle">Fill in the form below to register for a course</p>

    <form id="registrationForm">
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" placeholder="Enter your full name">
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter your email">
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" placeholder="Enter your phone number">
      </div>

      <div class="form-group">
        <label for="gmail">Gmail Address</label>
        <input type="email" id="gmail" placeholder="Enter your gmail address">
      </div>

      <div class="form-group">
        <label for="address">Student Address</label>
        <input type="text" id="address" placeholder="Enter your address">
      </div>

      <div class="form-group">
        <label for="age">Age</label>
        <input type="number" id="age" min="1" max="120" placeholder="Enter your age">
      </div>

      <div class="form-group">
        <label for="course">Course</label>
        <select id="course">
          <option value="">Select a course</option>
          <option value="JavaScript">JavaScript</option>
          <option value="Web Design">Web Design</option>
          <option value="Python">Python</option>
          <option value="Graphic Design">Graphic Design</option>
        </select>
      </div>

      <div class="form-group">
        <label for="faculty">Faculty</label>
        <select id="faculty">
          <option value="">Select a faculty</option>
          <option value="Art">Art</option>
          <option value="Science">Science</option>
          <option value="Commercial">Commercial</option>
        </select>
      </div>

      <div class="form-group">
        <label for="avatar">Upload Photo</label>
        <input type="file" id="avatar" accept="image/*">
        <div class="avatar-preview" id="avatarPreview">
          <span>No photo selected</span>
        </div>
      </div>

      <div class="form-group">
        <label for="idColor">ID Card Color</label>
        <div class="color-picker-row">
          <input type="color" id="idColor" value="#4a6fa5">
          <span id="colorLabel">#4a6fa5</span>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password">
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Confirm your password">
      </div>

      <div id="message" class="message"></div>

      <button type="submit">Register</button>
    </form>

    <div id="studentList" class="student-list">
      <h2>Registered Students</h2>
      <p id="studentCount">Total students: 0</p>
      <div id="studentCards"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
